name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Chrome
      if: matrix.browser == 'chrome'
      uses: browser-actions/setup-chrome@latest
    
    - name: Install Firefox
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-firefox@latest
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        webdriver-manager update --chrome --gecko
    
    - name: Run Robot Framework tests
      run: |
        robot \
          -d results \
          -v BROWSER:headless${{ matrix.browser }} \
          -i ${{ matrix.browser }} \
          tests/headless_browser_tests.robot
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.browser }}-py${{ matrix.python-version }}
        path: |
          results/log.html
          results/report.html
          results/output.xml
          results/screenshots/
    
    - name: Publish test results
      if: always()
      uses: mikepenz/action-junit-report@v3
      with:
        report_paths: results/output.xml
        check_name: Robot Framework Test Results (${{ matrix.browser }} - Python ${{ matrix.python-version }})

  docker-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t robot-framework-headless .
    
    - name: Run tests in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/results:/workspace/results \
          robot-framework-headless
    
    - name: Upload Docker test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: docker-test-results
        path: results/